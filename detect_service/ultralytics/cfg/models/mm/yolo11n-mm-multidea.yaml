# Ultralytics YOLO11 🚀 MultiModal Multi-level DEA Fusion Configuration
# YOLOMM RGB+X二元模态多层级DEA融合配置 - 基于成功单层DEA扩展
# 策略：在P3、P4、P5多个层级使用DEA模块进行跨模态融合
# 适用场景：需要充分利用多尺度跨模态特征互补性的复杂场景

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO11n + Multi-DEA
  s: [0.50, 0.50, 1024] # YOLO11s + Multi-DEA  
  m: [0.50, 1.00, 512]  # YOLO11m + Multi-DEA
  l: [1.00, 1.00, 512]  # YOLO11l + Multi-DEA
  x: [1.00, 1.50, 512]  # YOLO11x + Multi-DEA

# 多模态架构定义 - 基于成功单层DEA模式扩展的多层级融合
# 保持与单层DEA相同的基本架构，在多个层级添加DEA融合点

# 双路径 backbone - RGB路径和X路径独立提取特征（扩展到P5级别）
backbone:
  # RGB路径 (层0-9) - 提取RGB特征到P5级别  
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8  
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4 RGB P3特征 (用于P3-DEA融合)
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6 RGB P4特征 (用于P4-DEA融合)
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8 RGB P5特征 (用于P5-DEA融合)
  - [-1, 1, SPPF, [1024, 5]]              # 9 RGB特征提取结束

  # X路径 (层10-19) - 提取X模态特征到P5级别  
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 10-P1/2 X路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 11-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 12
  - [-1, 1, Conv, [256, 3, 2]]            # 13-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 14 X P3特征 (用于P3-DEA融合)
  - [-1, 1, Conv, [512, 3, 2]]            # 15-P4/16  
  - [-1, 2, C3k2, [512, True]]            # 16 X P4特征 (用于P4-DEA融合)
  - [-1, 1, Conv, [1024, 3, 2]]           # 17-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 18 X P5特征 (用于P5-DEA融合)
  - [-1, 1, SPPF, [1024, 5]]              # 19 X特征提取结束

  # 多层级DEA融合 (层20-22) - P3、P4、P5分别融合
  # P3级DEA融合 (浅层细节特征，80×80)
  - [[4, 14], 1, DEA, [8, 80]]            # 20 P3-DEA融合: RGB(层4)+X(层14)
                                           #    输入: 2×[B,512,80,80] 输出: [B,512,80,80]
                                           #    reduction=8: 细粒度注意力，适合细节特征
                                           #    kernel_size=80: 匹配P3特征图尺寸

  # P4级DEA融合 (中层语义特征，40×40)  
  - [[6, 16], 1, DEA, [16, 40]]           # 21 P4-DEA融合: RGB(层6)+X(层16)
                                           #    输入: 2×[B,512,40,40] 输出: [B,512,40,40]
                                           #    reduction=16: 平衡注意力，处理中层语义
                                           #    kernel_size=40: 匹配P4特征图尺寸

  # P5级DEA融合 (深层语义特征，20×20)
  - [[9, 19], 1, DEA, [16, 20]]           # 22 P5-DEA融合: RGB(层9)+X(层19)
                                           #    输入: 2×[B,1024,20,20] 输出: [B,1024,20,20]
                                           #    reduction=16: 粗粒度注意力，适合高层语义
                                           #    kernel_size=20: 匹配P5特征图尺寸

# 检测头 - 基于多层级DEA融合特征的多尺度检测头  
head:
  # 从P5-DEA开始构建FPN (层22: P5-DEA 20×20, 1024通道)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 P5-DEA上采样 20×20 → 40×40
  - [[-1, 21], 1, Concat, [1]]                   # 24 融合P5上采样 + P4-DEA特征 (40×40, 1536通道)
  - [-1, 2, C3k2, [512, False]]                  # 25 处理融合后P4特征 (40×40, 512通道)

  # 继续上采样到P3级别
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26 P4上采样 40×40 → 80×80  
  - [[-1, 20], 1, Concat, [1]]                   # 27 融合P4上采样 + P3-DEA特征 (80×80, 1024通道)
  - [-1, 2, C3k2, [256, False]]                  # 28 P3最终特征 (80×80, 256通道)

  # P4分支回连
  - [-1, 1, Conv, [256, 3, 2]]                   # 29 下采样 80×80 → 40×40 (256通道)
  - [[-1, 25], 1, Concat, [1]]                   # 30 融合下采样 + P4特征 (40×40, 768通道)  
  - [-1, 2, C3k2, [512, False]]                  # 31 P4最终特征 (40×40, 512通道)

  # P5分支回连
  - [-1, 1, Conv, [512, 3, 2]]                   # 32 下采样 40×40 → 20×20 (512通道)
  - [[-1, 22], 1, Concat, [1]]                   # 33 融合下采样 + P5-DEA特征 (20×20, 1536通道)
  - [-1, 2, C3k2, [1024, False]]                 # 34 P5最终特征 (20×20, 1024通道)

  - [[28, 31, 34], 1, Detect, [nc]]              # 35 Detect(P3, P4, P5)

# 多层级DEA配置优势：
# 1. 多尺度融合：P3专注细节，P4平衡语义和细节，P5专注高层语义
# 2. 参数适配：不同层级使用不同的reduction和kernel_size以适配特征特性
# 3. 特征丰富：每个检测层都包含充分的跨模态融合信息
# 4. 性能提升：相比单层融合，多层融合能更好地利用模态互补性
# 5. 基于成功模式：保持与单层DEA相同的基本架构逻辑

# 层级参数说明：
# P3-DEA: reduction=8, kernel_size=80  -> 细粒度注意力，捕获细节特征
# P4-DEA: reduction=16, kernel_size=40 -> 平衡注意力，处理中层语义
# P5-DEA: reduction=16, kernel_size=20 -> 粗粒度注意力，处理高层语义

# 架构设计原则：
# - 保持与成功单层DEA配置相同的RGB/X路径结构
# - 在P3、P4、P5三个关键层级添加DEA融合点
# - 检测头设计遵循标准FPN模式，从最深层开始构建
# - 通道数和特征图尺寸严格匹配，避免张量尺寸错误

# 使用建议：
# - 计算资源充足：推荐使用此多层级配置，效果优于单层级
# - 计算资源有限：可使用单层DEA配置 (yolo11n-mm-test.yaml)
# - 目标检测任务：P3、P4、P5三层级融合特别适合多尺度目标检测
# - 复杂场景：当RGB和X模态在不同尺度上互补性不同时，多层级融合更有效 