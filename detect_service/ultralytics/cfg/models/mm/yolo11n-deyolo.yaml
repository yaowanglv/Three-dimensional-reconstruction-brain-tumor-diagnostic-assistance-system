# Ultralytics YOLO11 🚀 DEYOLO MultiModal Configuration
# YOLOMM DEYOLO双增强多模态目标检测配置
# 策略：RGB和IR独立3通道输入 + 双骨干网络 + DEA跨模态注意力 + BiFocus双向聚焦
# 适用场景：RGB+IR跨模态目标检测，需要强特征增强和感受野扩展

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n-deyolo.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024] # YOLO11n-DEYOLO summary: 双骨干网络架构
  s: [0.33, 0.50, 1024] # YOLO11s-DEYOLO summary: 双骨干网络架构
  m: [0.67, 0.75, 768]  # YOLO11m-DEYOLO summary: 双骨干网络架构
  l: [1.00, 1.00, 512]  # YOLO11l-DEYOLO summary: 双骨干网络架构
  x: [1.00, 1.25, 512]  # YOLO11x-DEYOLO summary: 双骨干网络架构

# DEYOLO多模态架构定义 - 完全按照原始DEYOLO设计
# 采用RGB和IR独立3通道输入 + 双骨干网络 + DEA跨模态注意力 + BiFocus聚焦策略

# RGB骨干网络 - 主要特征提取路径
backbone:
  # RGB路径 (层0-9) - 集成BiFocus的特征提取
  - [-1, 1, Conv, [64, 3, 2], 'RGB']      # 0-P1/2 RGB路径起始
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]     # 2 集成BiFocus的C2f模块
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 6, C2f, [256, True]]             # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 6, C2f, [512, True]]             # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 3, C2f, [1024, True]]            # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9 RGB骨干网络结束

  # IR骨干网络 - 辅助特征提取路径  
  - [-1, 1, Conv, [64, 3, 2], 'X']        # 10-P1/2 IR路径起始（from=-1但实际从IR模态输入）
  - [-1, 1, Conv, [128, 3, 2]]            # 11-P2/4
  - [-1, 3, C2f_BiFocus, [128, True]]     # 12 集成BiFocus的C2f模块
  - [-1, 1, Conv, [256, 3, 2]]            # 13-P3/8
  - [-1, 6, C2f, [256, True]]             # 14
  - [-1, 1, Conv, [512, 3, 2]]            # 15-P4/16
  - [-1, 6, C2f, [512, True]]             # 16
  - [-1, 1, Conv, [1024, 3, 2]]           # 17-P5/32
  - [-1, 3, C2f, [1024, True]]            # 18
  - [-1, 1, SPPF, [1024, 5]]              # 19 IR骨干网络结束

# DEYOLO检测头 - 集成DEA双增强注意力的跨模态融合
head:
  # DEA双增强注意力层 - 跨模态特征增强
  - [[4, 14], 1, DEA, [256, 16, 80]]      # 20 P3级DEA注意力 (RGB层4 + IR层14)
  - [[6, 16], 1, DEA, [512, 16, 40]]      # 21 P4级DEA注意力 (RGB层6 + IR层16)  
  - [[9, 19], 1, DEA, [1024, 16, 20]]     # 22 P5级DEA注意力 (RGB层9 + IR层19)

  # 特征金字塔网络 - 基于DEA增强特征的FPN
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 P5上采样
  - [[-1, 21], 1, Concat, [1]]                   # 24 融合P4 DEA特征
  - [-1, 3, C2f, [512, False]]                   # 25 处理融合P4特征

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 26 P4上采样
  - [[-1, 20], 1, Concat, [1]]                   # 27 融合P3 DEA特征
  - [-1, 3, C2f, [256, False]]                   # 28 处理融合P3特征 (P3/8-small)

  # 下采样路径 - 构建完整的特征金字塔
  - [-1, 1, Conv, [256, 3, 2]]                   # 29 P3下采样
  - [[-1, 25], 1, Concat, [1]]                   # 30 融合P4特征
  - [-1, 3, C2f, [512, False]]                   # 31 最终P4特征 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 32 P4下采样
  - [[-1, 22], 1, Concat, [1]]                   # 33 融合P5 DEA特征
  - [-1, 3, C2f, [1024, False]]                  # 34 最终P5特征 (P5/32-large)

  - [[28, 31, 34], 1, Detect, [nc]]              # 35 Detect(P3, P4, P5)

# DEYOLO配置特点：
# 1. 双独立输入：RGB和IR各自独立的3通道输入，完全按照原始DEYOLO设计
# 2. 双骨干网络：RGB和IR模态独立特征提取，保持模态特异性
# 3. BiFocus增强：在两个骨干网络的早期层集成双向聚焦模块，扩大感受野
# 4. DEA跨模态注意力：多尺度DEA双增强注意力，实现跨模态特征增强
# 5. 对称设计：RGB和IR路径完全对称，确保特征维度匹配
# 6. 渐进融合：从P3到P5逐级进行DEA注意力增强和特征融合

# 适用场景：
# - RGB+IR目标检测（如M3FD、LLVIP数据集）
# - 需要强跨模态特征增强的场景
# - 对感受野和注意力机制要求较高的任务
# - 双模态特征互补性强的应用

# 性能特点：
# - 完全按照原始DEYOLO架构设计
# - 双独立3通道输入，无需6通道融合
# - DEA注意力提供跨模态特征增强
# - BiFocus模块扩大网络感受野
# - 与YOLOMM框架的双路径支持完全兼容

# 架构优势：
# - 保持原始DEYOLO的所有创新点
# - 利用YOLOMM框架的双路径输入能力
# - RGB和IR模态完全独立处理，保持特征纯净性
# - DEA模块实现真正的跨模态特征融合 