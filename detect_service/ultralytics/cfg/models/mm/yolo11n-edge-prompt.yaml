
# YOLO11 边缘引导渐进式融合配置（不完备开发，实验效果模块效果待验证
# 策略：边缘信息作为提示信号，在RGB特征提取过程中渐进式注入引导
# 核心理念：RGB为主导，边缘为提示，实现渐进式特征增强

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO11n summary: 319 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # YOLO11s summary: 319 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512]  # YOLO11m summary: 409 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512]  # YOLO11l summary: 631 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512]  # YOLO11x summary: 631 layers, 56966176 parameters, 56966160 gradients, 196.4 GFLOPs

# 边缘引导渐进式融合架构 - RGB主导+边缘提示
# 设计原则：
# 1. RGB分支保持完整的YOLO特征提取能力
# 2. 边缘分支轻量化设计，专注于提供引导信息
# 3. 在P2、P3、P4三个关键层级进行渐进式提示注入
# 4. 每次注入都基于前一次增强的结果，形成累积增强效应

# 渐进式边缘引导backbone
backbone:
  # RGB主路径起始 - 保持传统YOLO架构
  - [-1, 1, Conv, [16, 3, 2], 'RGB']      # 0-RGB P1/2起始 320x320 (3→16通道)
  - [-1, 1, Conv, [32, 3, 2]]             # 1-RGB P2/4基础特征 160x160 (16→32通道)
  
  # 边缘路径起始 - 匹配RGB通道数
  - [-1, 1, Conv, [16, 3, 2], 'self_edge'] # 2-边缘P1/2起始 320x320 (3→16通道，与RGB匹配)
  - [-1, 1, Conv, [32, 3, 2]]              # 3-边缘P2/4基础特征 160x160 (16→32通道，与RGB匹配)
  
  # 第一次边缘提示注入 - P2级别 (160x160) - 通道数匹配
  - [[1, 3], 1, EdgePrompt, [32]]          # 4-边缘P2提示增强RGB P2特征 (32+32→32)
  
  # RGB继续提取 - 基于增强后的特征
  - [-1, 2, C3k2, [64, False, 0.25]]       # 5-增强后的RGB P2特征处理 160x160 (32→64通道)
  - [-1, 1, Conv, [64, 3, 2]]              # 6-RGB P3/8特征 80x80 (64→64通道)
  
  # 边缘路径继续 - 匹配RGB通道数
  - [3, 2, C3k2, [64, False, 0.25]]        # 7-边缘P2特征处理 160x160 (32→64通道，与RGB匹配)
  - [-1, 1, Conv, [64, 3, 2]]              # 8-边缘P3/8特征 80x80 (64→64通道，与RGB匹配)
  
  # 第二次边缘提示注入 - P3级别 (80x80) - 通道数匹配
  - [[6, 8], 1, EdgePrompt, [64]]          # 9-边缘P3提示增强RGB P3特征 (64+64→64)
  
  # RGB深层特征提取
  - [-1, 2, C3k2, [128, False, 0.25]]      # 10-增强后的RGB P3特征处理 80x80 (64→128通道)
  - [-1, 1, Conv, [128, 3, 2]]             # 11-RGB P4/16特征 40x40 (128→128通道)
  
  # 边缘路径深层处理 - 匹配RGB通道数
  - [8, 2, C3k2, [128, False, 0.25]]       # 12-边缘P3特征处理 80x80 (64→128通道，与RGB匹配)
  - [-1, 1, Conv, [128, 3, 2]]             # 13-边缘P4/16特征 40x40 (128→128通道，与RGB匹配)
  
  # 第三次边缘提示注入 - P4级别 (40x40) - 通道数匹配
  - [[11, 13], 1, EdgePrompt, [128]]       # 14-边缘P4提示增强RGB P4特征 (128+128→128)
  
  # 最终特征提取 - 基于三次增强的RGB特征
  - [-1, 2, C3k2, [128, True]]             # 15-最终增强的RGB P4特征 40x40 (128→128通道)
  - [-1, 1, SPPF, [128, 5]]                # 16-空间金字塔池化 40x40 (128→128通道)

# 检测头 - 基于边缘引导增强的特征
head:
  # P4/16分支 - 从最终增强特征开始
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 17 上采样到P3尺度 80x80
  - [[-1, 10], 1, Concat, [1]]                   # 18 与增强的P3特征融合 80x80
  - [-1, 2, C3k2, [512, False]]                  # 19 处理融合后的P3特征 80x80

  # P3/8分支 - 继续上采样
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 20 上采样到P2尺度 160x160
  - [[-1, 5], 1, Concat, [1]]                    # 21 与增强的P2特征融合 160x160
  - [-1, 2, C3k2, [256, False]]                  # 22 最终P3特征 160x160

  # P4/16分支回连
  - [-1, 1, Conv, [256, 3, 2]]                   # 23 下采样回P3尺度 80x80
  - [[-1, 19], 1, Concat, [1]]                   # 24 特征融合 80x80
  - [-1, 2, C3k2, [512, False]]                  # 25 最终P4特征 80x80

  # P5/32分支回连  
  - [-1, 1, Conv, [512, 3, 2]]                   # 26 下采样到P4尺度 40x40
  - [[-1, 16], 1, Concat, [1]]                   # 27 与原始增强特征融合 40x40
  - [-1, 2, C3k2, [1024, False]]                 # 28 最终P5特征 40x40

  - [[22, 25, 28], 1, Detect, [nc]]              # 29 多尺度检测头

# 边缘引导渐进式融合优势：
# 1. RGB主导性：RGB分支保持完整YOLO架构，边缘只作为引导提示
# 2. 渐进增强：P2→P3→P4三个层级的累积增强，特征表达能力逐步提升
# 3. 轻量边缘：边缘分支通道数减半，计算开销小，专注提供引导信息
# 4. 累积效应：每次注入都基于前一次增强结果，形成递进式特征优化
# 5. 灵活控制：EdgePrompt模块可学习注入强度，自适应调节引导程度

# EdgePrompt模块设计要点：
# - 边缘特征→提示权重生成
# - RGB特征的引导式增强
# - 可学习的注入强度控制
# - 残差连接保持RGB主导地位

# 支持的自体模态类型：
# - self_edge: 边缘检测模态（Sobel、Canny、Scharr算法）
# - self_texture: 纹理提取模态（LBP、Gabor、方差算法）  
# - self_gradient: 梯度计算模态（幅度、方向、组合算法）

# 使用方法：
# 1. 训练：python train.py --model yolo11n-edge-prompt.yaml --data your_dataset.yaml
# 2. 推理：python predict.py --model trained_model.pt --source image.jpg
# 3. 切换模态：将第2层的'self_edge'改为'self_texture'或'self_gradient' 